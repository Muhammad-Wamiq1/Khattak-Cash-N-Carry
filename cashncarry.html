<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khattak Cash & Carry - Terminal System</title>
    <style>
        :root {
            --primary: #10b981; /* Emerald Success Green */
            --accent: #3b82f6; /* Tech Blue */
            --warning: #f59e0b; /* Amber Warning Orange */
            --bg: #090d16;
            --surface: #111827;
            --surface-card: #1f2937;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Enterprise Header Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 6%;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-pill {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--primary);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
        }

        /* Main Workspace Panel */
        .workspace {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        /* Left Column: Interactive Scanner Control */
        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .scanner-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Laser Scanning Animation Graphic */
        .scanner-viewport {
            width: 100%;
            max-width: 450px;
            height: 220px;
            background: #030712;
            border-radius: 12px;
            margin: 25px auto;
            position: relative;
            border: 2px dashed rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .scanner-viewport::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            left: 0;
            top: 0;
            box-shadow: 0 0 15px var(--primary);
            animation: laserScan 2.5s infinite linear;
        }

        @keyframes laserScan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .barcode-graphic {
            font-size: 5rem;
            opacity: 0.25;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .action-row {
            display: flex;
            gap: 15px;
            max-width: 550px;
            margin: 0 auto;
        }

        .action-row input {
            flex: 1;
            background: #070a12;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 25px;
            border-radius: 50px;
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
        }

        .action-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .btn-scan {
            background: linear-gradient(45deg, var(--primary), #059669);
            color: #060814;
            font-weight: 700;
            border: none;
            padding: 16px 35px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s ease;
        }

        .btn-scan:hover {
            transform: scale(1.03);
        }

        /* Inventory Registry Grid */
        .cart-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: border-color 0.3s ease;
        }

        .item-card:hover {
            border-color: rgba(59, 130, 246, 0.25);
        }

        .item-icon {
            font-size: 2.2rem;
            background: rgba(255,255,255,0.03);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .item-details h4 {
            font-size: 1.15rem;
            margin-bottom: 4px;
        }

        .item-details p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .price-tag {
            color: var(--primary);
            font-weight: 700;
            margin-top: 5px;
            font-size: 1.05rem;
        }

        /* Right Column: Checkout Billing & Review Panels */
        .sidebar-panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .checkout-box {
            background: var(--surface);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .billing-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
            color: var(--text-muted);
        }

        .billing-row.total {
            border-bottom: none;
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            padding-top: 20px;
        }

        .total-price {
            color: var(--primary);
        }

        .btn-checkout {
            width: 100%;
            background: linear-gradient(45deg, var(--accent), #2563eb);
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
        }

        /* Customer Feedback Segment */
        .review-box {
            background: var(--surface);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .review-box h3 {
            margin-bottom: 15px;
            font-size: 1.25rem;
        }

        .stars {
            color: var(--warning);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .review-card {
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 10px;
            border-left: 3px solid var(--accent);
            margin-top: 15px;
        }

        .review-card p {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-style: italic;
        }

        .reviewer {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-style: normal;
            font-weight: 600;
        }

        /* Footer Signature Block */
        footer {
            text-align: center;
            padding: 30px 20px;
            background: #060911;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: auto;
        }

        footer p {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        footer span {
            color: var(--primary);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand">
            <div class="logo">KHATTAK CASH & CARRY</div>
            <div class="system-pill">POS Core v4.2</div>
        </div>
    </nav>

    <div class="workspace">
        <!-- Main Interactive Scanning Workspace Panel -->
        <main class="main-panel">
            <section class="scanner-card">
